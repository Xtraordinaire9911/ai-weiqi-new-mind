# Example analysis config for the CPU (Eigen) backend. Slow, but it works on any computer without a graphics card.
# Set numSearchThreadsPerAnalysisThread to about the number of physical cores. Use a small network (for example b10 or b15).
logDir = analysis_logs
reportAnalysisWinratesAs = BLACK
maxVisits = 200
numAnalysisThreads = 1
numSearchThreadsPerAnalysisThread = 4
nnCacheSizePowerOfTwo = 20
nnMutexPoolSizePowerOfTwo = 14
nnRandomize = true
