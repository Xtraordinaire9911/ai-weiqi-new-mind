# Example analysis config for a GPU backend (OpenCL, CUDA, TensorRT, Metal). Copy it, edit it, and pass it with --config.
# These numbers are a starting point, not a measurement: run `katago benchmark` once and adjust them to your card.
# The bridge also forces reportAnalysisWinratesAs=BLACK on the command line, so this file cannot change the score perspective.
logDir = analysis_logs
reportAnalysisWinratesAs = BLACK
maxVisits = 500
numAnalysisThreads = 2
numSearchThreadsPerAnalysisThread = 16
nnMaxBatchSize = 32
nnCacheSizePowerOfTwo = 22
nnMutexPoolSizePowerOfTwo = 16
nnRandomize = true
