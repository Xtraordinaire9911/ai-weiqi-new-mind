name: Video suggestion / 视频建议
description: Suggest a video series that could be added to the library / 建议把某个视频系列加入定式库
title: "video: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        A link and a short reason are enough. Please do not attach video files or full transcripts.

        给出链接和一句理由就够了。请不要附上视频文件或完整的转写稿。
  - type: input
    id: link
    attributes:
      label: Link to the video or playlist / 视频或合集的链接
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why it would be a good fit / 为什么适合收录
    validations:
      required: true
