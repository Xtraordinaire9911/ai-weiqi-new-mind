function parse(s){let i=0;

 function grp(x,y){const c=b[x][y],seen=new Set([x+','+y]),st=[[x,y]],g=[];let lib=0;while(st.length){const[a,d]=st.pop();g.push([a,d]);for(const[e,f]of nb(a,d)){if(b[e][f]===0)lib++;else if(b[e][f]===c&&!seen.has(e+','+f)){seen.add(e+','+f);st.push([e,f])}}}return{g,lib}}
 for(const n of path){for(const[key,c]of[['AB',1],['AW',2],['AE',0]])(n.p[key]||[]).flatMap(expand).forEach(v=>{const q=pt(v);b[q[0]][q[1]]=c});
  for(const[key,c]of[['B',1],['W',2]]){if(!n.p[key])continue;const q=pt(n.p[key][0]);if(!q||q[0]>=N)continue;b[q[0]][q[1]]=c;k++;num.set(q[0]+','+q[1],k);last=q;
   for(const[e,f]of nb(q[0],q[1]))if(b[e][f]===3-c){const r=grp(e,f);if(!r.lib)r.g.forEach(([a,d])=>{b[a][d]=0;num.delete(a+','+d)})}
   const r=grp(q[0],q[1]);if(!r.lib)r.g.forEach(([a,d])=>b[a][d]=0)}}

// ---- 状态 ----
const $=id=>document.getElementById(id),cv=$('cv'),g=cv.getContext('2d');let candPts=[],hoverG=[],cur,tree,col,showN=true,showAI=true,sel=0,hot=[],ghost=[],view;
function bbox(root){const xs=[],ys=[];(function w(n){for(const k of['AB','AW','B','W'])(n.p[k]||[]).flatMap(expand).forEach(v=>{const q=pt(v);if(q&&q[0]<N){xs.push(q[0]);ys.push(q[1])}});n.c.forEach(w)})(root);
 if(!xs.length)return{x0:0,y0:0,x1:18,y1:18};const pc=(a,p)=>{a.sort((u,v)=>u-v);return a[Math.min(a.length-1,Math.floor(a.length*p))]};

 if(x0<=3)x0=0;if(y0<=3)y0=0;if(x1>=15)x1=18;if(y1>=15)y1=18;const w=Math.max(x1-x0,y1-y0,10);

  ladderMsg=`征子演示(追方${cn},被征${pn},${pick.path.length}手):`+({capture:pick.edge?'撞边被提 → 征子成立,追方'+cn+'有利':'遇到追方'+cn+'子被提 → 征子成立,追方'+cn+'有利',

function panel(k){const co=(cur.p.C||[''])[0],box=$('cm');box.innerHTML='';
 const secs=co.split(/\n(?=【)/).filter(s=>s.trim());
 secs.forEach(s=>{const mt=/^【([^】]+)】/.exec(s),h=mt?mt[1].replace(/\s*@\S+/,''):'',cls=h.includes('要点')?'kp':h.includes('周边')?'ctx':h.includes('AI')?'ai':'';let body=((mt&&/@\S+/.test(mt[1])?'@'+/@(\S+)/.exec(mt[1])[1]+' ':'')+(mt?s.slice(mt[0].length):s)).trim();
  body=body.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/⟨([^⟩]+)⟩/g,(a,t)=>{const ps=t.trim().split(/\s+/);return ps.length>1?`<span class="chip pv" data-pv="${ps.join(' ')}">${ps[0]}…${ps.length}手</span>`:`<span class="chip" data-pv="${ps[0]}">${ps[0]}</span>`}).replace(/@(?:(\d+)\|)?(\d+):(\d\d)/g,(a,v,mm,ss)=>`<span class="t" data-v="${v||0}" data-t="${+mm*60+ +ss}">▶${v?'视频'+(+v+1)+' ':''}${mm}:${ss}</span>`);
  box.insertAdjacentHTML('beforeend',`<div class="card ${cls}">${h?`<h5>${h}</h5>`:''}${body}</div>`)});
 if(cur.c.length>=2&&!(cur.p.AN||[''])[0])box.insertAdjacentHTML('beforeend','<div class="card ai"><h5>AI局部评估</h5>本分组的 AI 分析正在用修正后的方法重新生成(旧结果因分数视角错误已撤下),完成后这里会显示候选点与老师着法的目数对比。</div>');
 // 变化列表
 const vs=$('vars');vs.innerHTML='';cur.c.forEach((c,i)=>{const bt=document.createElement('button'),mv=c.p.B||c.p.W,q=mv&&pt(mv[0]),an=(cur.p.AN||[''])[0].split(';').find(s=>s.startsWith(mv?mv[0]+':':'#'));
  const kp=((c.p.C||[''])[0].match(/【要点与考量】([^\n]*)/)||[])[1]||'',al=an?+an.split(':')[1]:null;
  bt.textContent=`${i+1}. ${c.p.B?'●':'○'} ${q&&q[0]<N?gtp(q):'脱先/他处'}${al===null?'':al>-0.05?'  AI最优':'  AI '+al.toFixed(1)+'目'}${kp?'  '+kp.slice(0,22):''}`;bt.onclick=()=>go(c);if(i==sel)bt.classList.add('on');vs.appendChild(bt)});
 // 手顺
 const ns=[];for(let n=cur;n;n=n.up)ns.unshift(n);$('path').innerHTML='';ns.forEach((n,i)=>{const mv=n.p.B||n.p.W;if(!mv)return;const s=document.createElement('span'),q=pt(mv[0]);s.textContent=`${i}.${n.p.B?'●':'○'}${gtp(q)}`;if(n===cur)s.className='cur';s.onclick=()=>go(n);$('path').appendChild(s)});
 $('info').textContent=`第${k}手 · ${cur.c.length?cur.c.length+'个后续':'终点'}`}
function go(n){cur=n;sel=0;hot=[];ghost=[];ladderMsg='';draw()}
// ---- 交互 ----
$('cm').onclick=e=>{const t=e.target;if(t.dataset.t!==undefined){open(`https://www.bilibili.com/video/${col.vb[+t.dataset.v]||col.vb[0]}?t=${t.dataset.t}`)}
 else if(t.dataset.pv){document.querySelectorAll('.chip').forEach(c=>c.classList.remove('hot'));t.classList.add('hot');const ps=t.dataset.pv.split(' ').map(fromGtp).filter(Boolean);hot=[];ghost=[];ladderMsg='';if(ps.length>1)ghost=ps;else hot=ps;drawBoard()}};
function bp(e){const r=cv.getBoundingClientRect(),V=Vnow,span=Math.max(V.x1-V.x0,V.y1-V.y0),m=r.width/(span+1.6);return[Math.round((e.clientX-r.left-.8*m)/m)+V.x0,Math.round((e.clientY-r.top-.8*m)/m)+V.y0]}
const tip=document.body.appendChild(Object.assign(document.createElement('div'),{style:'position:fixed;display:none;background:#222;color:#fff;padding:6px 9px;border-radius:6px;font:12px/1.5 sans-serif;pointer-events:none;z-index:9;max-width:260px'}));
cv.onmousemove=e=>{const[x,y]=bp(e),c=candPts.find(c=>c.q[0]==x&&c.q[1]==y);if(c){const nh=c.pv.map(fromGtp).filter(Boolean);if(hoverG.join()!=nh.join()){hoverG=nh;drawBoard()}tip.style.display='block';tip.style.left=e.clientX+14+'px';tip.style.top=e.clientY+14+'px';tip.innerHTML=`<b>${gtp(c.q)}</b> ${c.loss>-0.05?'局部最优':'比最优差 '+(-c.loss).toFixed(1)+' 目'}<br>(只搜局部,不显示全盘胜率)<br>${c.p<0?'老师走的着法,已单独评估':'AI先验 '+Math.round(c.p*100)+'%'} · 搜索${c.vis}次<br>变化: ${c.pv.join(' ')}`}else{tip.style.display='none';if(hoverG.length){hoverG=[];drawBoard()}}};
cv.onmouseleave=()=>{tip.style.display='none';if(hoverG.length){hoverG=[];drawBoard()}};
cv.onclick=e=>{const r=cv.getBoundingClientRect(),V=Vnow,span=Math.max(V.x1-V.x0,V.y1-V.y0),m=r.width/(span+1.6),x=Math.round((e.clientX-r.left-.8*m)/m)+V.x0,y=Math.round((e.clientY-r.top-.8*m)/m)+V.y0;
 const c=cur.c.find(c=>{const q=pt((c.p.B||c.p.W||[''])[0]);return q&&q[0]==x&&q[1]==y});if(c){go(c);return}
 const cd=candPts.find(c=>c.q[0]==x&&c.q[1]==y);if(cd){ghost=cd.pv.map(fromGtp).filter(Boolean);hot=[];drawBoard();return}
 const key=gtp([x,y]);document.querySelectorAll('.chip').forEach(c=>{const h=c.dataset.pv.split(' ').includes(key);c.classList.toggle('hot',h);if(h)c.scrollIntoView({block:'nearest'})})};
const nav={b0:()=>go(tree),b1:()=>cur.up&&go(cur.up),b2:()=>cur.c[sel]&&go(cur.c[sel]),b3:()=>{let n=cur;while(n.c[0])n=n.c[0];go(n)}};
for(const k in nav)$(k).onclick=nav[k];$('bn').onclick=()=>{showN=!showN;draw()};$('bf').onclick=()=>{viewMode=(viewMode+1)%3;draw()};$('bl').onclick=ladderDemo;$('ba').onclick=()=>{showAI=!showAI;draw()};$('bk').onclick=()=>navigator.clipboard.writeText(col.sgf);
onkeydown=e=>{if(e.target.tagName==='INPUT')return;const k=e.key;if(k==='ArrowLeft')nav.b1();else if(k==='ArrowRight')nav.b2();else if(k==='ArrowUp'){sel=Math.max(0,sel-1);panel()}else if(k==='ArrowDown'){sel=Math.min(cur.c.length-1,sel+1);panel()}else if(k==='Home')nav.b0();else if(k==='End')nav.b3()};
// ---- 库 ----
function open_(c){col=c;tree=parse(c.sgf);view=bbox(tree);c.vb=((tree.p.PC||[''])[0].match(/BV\w+/g))||c.videos.map(v=>v.bvid);$('ti').textContent=c.name;$('vd').innerHTML=c.videos.map((v,i)=>`<div><a target="_blank" href="https://www.bilibili.com/video/${v.bvid}">▶ ${v.title}</a></div>`).join('');go(tree);document.querySelectorAll('#list div').forEach(d=>d.classList.toggle('on',d.dataset.id===c.id))}
function renderList(){const q=$('q').value.trim(),s=$('src').value,box=$('list');box.innerHTML='';let ser='';
 LIB.filter(c=>c.source===s&&(!q||c.name.includes(q)||c.videos.some(v=>v.title.includes(q)))).forEach(c=>{if(c.series!==ser){ser=c.series;box.insertAdjacentHTML('beforeend',`<h4>${c.sourceName} · ${ser}</h4>`)}const d=document.createElement('div');d.textContent=c.name;d.dataset.id=c.id;d.onclick=()=>open_(c);box.appendChild(d)})}
[...new Set(LIB.map(c=>c.source))].forEach(s=>$('src').add(new Option(LIB.find(c=>c.source===s).sourceName,s)));
$('src').onchange=$('q').oninput=renderList;renderList();
{$('ver').textContent='界面 v3 · 数据 '+(window.LIBT||'旧缓存?');const M=LIB.length,D=LIB.filter(c=>c.sgf.length>1500).length,pg=$('prog');if(D<M){pg.style.display='block';pg.textContent=`内容生成中: ${D}/${M} 个定式已完成`}
 open_(LIB.slice().sort((a,b)=>b.sgf.length-a.sgf.length)[0])}
</script></body></html>
