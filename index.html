 function seq(par){let last=par;while(i<s.length){const ch=s[i];
  if(ch===';'){i++;const n={p:{},c:[],up:last};while(i<s.length){while(/\s/.test(s[i]))i++;const m=/^[A-Za-z]+/.exec(s.slice(i,i+10));if(!m)break;i+=m[0].length;const a=[];while(s[i]==='['||/\s/.test(s[i])){if(s[i]==='[')a.push(val());else i++}n.p[m[0]]=(n.p[m[0]]||[]).concat(a)}last.c.push(n);last=n}

 function grp(x,y){const c=b[x][y],seen=new Set([x+','+y]),st=[[x,y]],g=[];let lib=0;while(st.length){const[a,d]=st.pop();g.push([a,d]);for(const[e,f]of nb(a,d)){if(b[e][f]===0)lib++;else if(b[e][f]===c&&!seen.has(e+','+f)){seen.add(e+','+f);st.push([e,f])}}}return{g,lib}}
 for(const n of path){for(const[key,c]of[['AB',1],['AW',2],['AE',0]])(n.p[key]||[]).flatMap(expand).forEach(v=>{const q=pt(v);b[q[0]][q[1]]=c});
  for(const[key,c]of[['B',1],['W',2]]){if(!n.p[key])continue;const q=pt(n.p[key][0]);if(!q||q[0]>=N)continue;b[q[0]][q[1]]=c;k++;num.set(q[0]+','+q[1],k);last=q;
   for(const[e,f]of nb(q[0],q[1]))if(b[e][f]===3-c){const r=grp(e,f);if(!r.lib)r.g.forEach(([a,d])=>{b[a][d]=0;num.delete(a+','+d)})}
   const r=grp(q[0],q[1]);if(!r.lib)r.g.forEach(([a,d])=>b[a][d]=0)}}

function bbox(root){const xs=[],ys=[];(function w(n){for(const k of['AB','AW','B','W'])(n.p[k]||[]).flatMap(expand).forEach(v=>{const q=pt(v);if(q&&q[0]<N){xs.push(q[0]);ys.push(q[1])}});n.c.forEach(w)})(root);
 if(!xs.length)return{x0:0,y0:0,x1:18,y1:18};const pc=(a,p)=>{a.sort((u,v)=>u-v);return a[Math.min(a.length-1,Math.floor(a.length*p))]};
 let x0=Math.max(0,pc(xs,.03)-2),x1=Math.min(18,pc(xs,.97)+2),y0=Math.max(0,pc(ys,.03)-2),y1=Math.min(18,pc(ys,.97)+2);

const LOC={x1:10,y0:8}, FULL={x0:0,y0:0,x1:18,y1:18}, VM=['自动','聚焦','全盘'];

let viewMode=0,ladderMsg='',raf=0,Vnow=FULL;
function ctxInfo(b,co){const stones=[];for(let x=0;x<N;x++)for(let y=0;y<N;y++)if(b[x][y]&&!(x<=LOC.x1&&y>=LOC.y0))stones.push([x,y]);

const nb4=(x,y)=>[[x+1,y],[x-1,y],[x,y+1],[x,y-1]].filter(([a,c])=>a>=0&&c>=0&&a<N&&c<N);

  const[x,y]=pg.libs[0];if(!put(bd,x,y,pc))return{path,out:'noatari',cc,pc};path.push([x,y,pc]);
  const g2=grpOf(bd,x,y);

   const[e,f]=q.libs[0],t2=t.map(r=>r.slice());if(!put(t2,e,f,pc)){best=best||[a,c,9];continue}const n=grpOf(t2,e,f).libs.length;const sc=n===2?0:n;if(!best||sc<best[2])best=[a,c,sc]}
  if(!best)return{path,out:'noatari',cc,pc};put(bd,best[0],best[1],cc);path.push([best[0],best[1],cc])}

 for(let x=0;x<N;x++)for(let y=0;y<N;y++)if(b[x][y]&&!seen.has(x+','+y)){const r=grpOf(b,x,y);r.g.forEach(q=>seen.add(q+''));if(r.libs.length<=2&&r.libs.length>0)cand.push({x,y,n:Math.max(...r.g.map(([a,c])=>num.get(a+','+c)||0)),l:r.libs.length})}

function anOf(n){const l=window.RC&&RC.live(n);return l?l.an:(n.c.length?(n.p.AN||[''])[0]:'')} // candidate-point data: live results from the compute switch take priority, otherwise use the cached AN

// ---- Hover preview of the teacher's branches ----
